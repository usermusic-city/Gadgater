name: Gadgater Release Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest

    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk
      GRADLE_HOME: /opt/gradle
      ANDROID_HOME: /opt/android-sdk
      PROJECT_DIR: /sdcard/projects/Gadgater-0.1.2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: 34.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean build
        run: ./gradlew clean --no-daemon -Dorg.gradle.vfs.watch=false --stacktrace

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            -Dorg.gradle.vfs.watch=false \
            -Djava.io.tmpdir=./.gradle-tmp \
            --stacktrace

      - name: List output
        run: |
          echo "=== Build Output ==="
          find . -name "*.apk" -type f -exec ls -lh {} \;
          echo "=== APK Details ==="
          ls -lh app/build/outputs/apk/release/

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: gadgater-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.2-${{ github.run_number }}
          name: Gadgater v0.1.2 Build ${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
