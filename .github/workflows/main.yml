name: Gadgater Release Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK_DIR=$SDK_DIR"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
              echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
              export PATH="$SDK_DIR/cmdline-tools/latest/bin:$PATH"
            fi
          fi
          command -v sdkmanager
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            export PATH="$SDK_DIR/cmdline-tools/latest/bin:$PATH"
          fi
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          sdkmanager --list_installed
          test -d "$SDK_DIR/platforms/android-34"
          test -d "$SDK_DIR/build-tools/34.0.0"

      - name: Prepare Gradle tmp dir
        run: mkdir -p "${{ github.workspace }}/.gradle-tmp"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Clean build
        run: |
          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.vfs.watch=false \
            -Djava.io.tmpdir="${{ github.workspace }}/.gradle-tmp"

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.vfs.watch=false \
            -Djava.io.tmpdir="${{ github.workspace }}/.gradle-tmp"

      - name: List build output
        shell: bash
        run: |
          set -e
          echo "=== Build Output ==="
          find . -name "*.apk" -type f -exec ls -lh {} \;
          echo "=== APK Details ==="
          ls -lh app/build/outputs/apk/release/

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: gadgater-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.2-${{ github.run_number }}
          name: Gadgater v0.1.2 Build ${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
