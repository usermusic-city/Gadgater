name: Gadgater Release Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          sdkmanager --list_installed
          test -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/platforms/android-34"
          test -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/34.0.0"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Clean build
        run: |
          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.vfs.watch=false

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.vfs.watch=false \
            -Djava.io.tmpdir="${{ github.workspace }}/.gradle-tmp"

      - name: List build output
        shell: bash
        run: |
          set -e
          echo "=== Build Output ==="
          find . -name "*.apk" -type f -exec ls -lh {} \;

          echo "=== APK Details ==="
          ls -lh app/build/outputs/apk/release/

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: gadgater-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.2-${{ github.run_number }}
          name: Gadgater v0.1.2 Build ${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean build
        run: ./gradlew clean --no-daemon -Dorg.gradle.vfs.watch=false --stacktrace

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            -Dorg.gradle.vfs.watch=false \
            -Djava.io.tmpdir=./.gradle-tmp \
            --stacktrace

      - name: List output
        run: |
          echo "=== Build Output ==="
          find . -name "*.apk" -type f -exec ls -lh {} \;
          echo "=== APK Details ==="
          ls -lh app/build/outputs/apk/release/

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: gadgater-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.2-${{ github.run_number }}
          name: Gadgater v0.1.2 Build ${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
